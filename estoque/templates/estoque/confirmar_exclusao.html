{% extends "estoque/base.html" %}
{% block title %}Excluir material{% endblock %}
{% block content %}
<div class="pagina-cabecalho"><div><p class="sobretitulo">CONFIRMAÇÃO</p><h1>Excluir material</h1></div></div>
<section class="painel confirmacao"><div class="alerta-grande">!</div><h2>Deseja remover “{{ produto.nome }}”?</h2><p>Esta ação não poderá ser desfeita.</p><form method="post">{% csrf_token %}<button class="botao perigo" type="submit">Sim, excluir</button><a class="botao secundario" href="{% url 'estoque:lista' %}">Cancelar</a></form></section>
{% endblock %}
